name: Monitor diario de precios

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitorear:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl playwright

      - name: Instalar Chromium de Playwright
        run: |
          for i in 1 2 3; do
            python -m playwright install chromium && break
            echo "Falló instalación de Chromium. Reintento $i..."
            sleep 15
          done

      - name: Instalar dependencias de Chromium
        run: |
          for i in 1 2 3; do
            sudo apt-get update && \
            python -m playwright install-deps chromium && break
            echo "Falló instalación de dependencias. Reintento $i..."
            sleep 20
          done

      - name: Ejecutar monitor de precios
        run: python monitor_precios.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "monitor-bot"
          git config --global user.email "monitor-bot@users.noreply.github.com"
          git add historial_precios.xlsx
          git diff --staged --quiet || git commit -m "Actualiza precios $(date +'%Y-%m-%d')"
          git push
